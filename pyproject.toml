[project]
name = "talon"
version = "0.1.0"
description = "Single-vehicle UAV autopilot: C++ computational kernel with Python tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pymavlink>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The native extension `talon._core` is built by CMake, not by the Python
# build backend. From the repository root:
#   cmake -B build && cmake --build build -j
# which drops _core*.so into src/talon/. This file only manages Python deps.
