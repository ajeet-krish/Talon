# Talon CI: the Rust GNC core, its two wrappers, and the web app.
#
# Layout: the autopilot lives in core/ and nowhere else. wasm/ wraps it for the
# browser, bindings/ wraps it for Python (PyO3), and the web app (Vite + React)
# owns the repository root. See AGENTS.md for the map.
#
# Three jobs, one per consumer of the core, so a failure names the wrapper it
# came from: `core` (Rust + PyO3 + pytest), `wasm` (browser bundle), `web`
# (typecheck, vitest, production build).

name: CI

# Least privilege: no CI step writes to the repository, so the default
# (writable) token is narrowed to read-only file access.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  core:
    name: Rust core, PyO3 bindings, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync Python environment
        # Creates .venv with numpy, scipy, matplotlib, pymavlink, pytest.
        # .cargo/config.toml points PYO3_PYTHON at .venv/bin/python, so cargo
        # builds the extension against the same interpreter pytest imports it
        # with, without any extra wiring here.
        run: uv sync

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        # Style gate before any test runs: rustfmt output is authoritative,
        # so a diff here means an edit bypassed `cargo fmt --all`.
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        # Deny-by-default so warnings cannot accumulate. Runs after `uv sync`
        # and the toolchain install: the repo's .cargo/config.toml points
        # PYO3_PYTHON at .venv/bin/python, so the PyO3 crate only compiles
        # once both are in place.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (talon-core, talon-wasm, talon-py)
        # The wasm binding tests run natively; no wasm target needed here.
        run: cargo test --workspace

      - name: Build the talon._core extension
        run: ./bindings/build.sh

      - name: Verify talon._core imports
        # Hard-fail before pytest if the extension is missing or broken;
        # without this a missing _core would skip every test and the run
        # would still be green with zero tests executed.
        run: uv run python -c "import talon._core"

      - name: Run Python tests (pytest)
        env:
          # Belt and braces: conftest.py skips all tests when the native
          # extension is missing; with this set it fails instead, so the
          # suite can never silently pass with zero tests run.
          TALON_REQUIRE_CORE: "1"
        run: uv run pytest python/tests/ -q

  wasm:
    name: WebAssembly bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build the browser kernel
        run: ./wasm/build.sh

      - name: Confirm the committed bundle is current
        # The generated JS and type declarations are a pure function of the
        # crate's exported surface and the wasm-bindgen version (pinned by the
        # committed Cargo.lock), so a clean rebuild must reproduce them byte for
        # byte. A diff means the core changed without re-running
        # ./wasm/build.sh, which would ship a stale autopilot to Pages. The
        # .wasm binary is deliberately not compared: it varies with the exact
        # rustc build and would be brittle.
        run: >
          git diff --exit-code --
          public/wasm-rust/talon_core.js
          public/wasm-rust/talon_core.d.ts
          public/wasm-rust/talon_core_bg.wasm.d.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Headless live-run smoke test
        # Drives the freshly built module the way the page does: every live
        # config, plus a paced 1x run checked against wall clock.
        run: npm run smoke:wasm

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck and production build
        run: npm run build
