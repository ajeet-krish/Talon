[package]
name = "talon-core"
description = "Talon GNC core: dynamics, wind, control, estimation, guidance, mission, FDIR, sensors, motors, and the SIL runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
libm = "0.2.16"
nalgebra = "0.33.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# TypeScript mirror generation (D23, Phase 5c). Optional and feature-gated so
# the wasm and PyO3 builds never see it; pinned exactly because the generated
# declarations in src/types/generated/ are committed and must not drift with a
# ts-rs release.
ts-rs = { version = "=12.0.1", optional = true }

[features]
# Emits the `TS` derives and the ignored `core/tests/ts_export.rs` generator.
# Run ./scripts/gen_types.sh to regenerate src/types/generated/talon_core.ts.
ts-export = ["dep:ts-rs"]
